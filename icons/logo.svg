    <g stroke-width="3">
      <rect x="80" y="246" width="20" height="22" fill="#f3c9a4"/>
      <rect x="140" y="246" width="20" height="22" fill="#f3c9a4"/>
      <rect x="77" y="266" width="26" height="26" rx="4" fill="#f1eee4"/>
      <rect x="137" y="266" width="26" height="26" rx="4" fill="#f1eee4"/>
      <path d="M84 271v17M90 271v17M96 271v17M144 271v17M150 271v17M156 271v17" stroke="#b9b2a0" stroke-width="2"/>
      <path d="M70 302c0-8 6-12 16-12h12c5 0 7 3 7 7v5z" fill="#2b2116"/>
      <path d="M135 302v-5c0-4 2-7 7-7h12c10 0 16 4 16 12z" fill="#2b2116"/>
    </g>
    <!-- Hosenbeine -->
    <path d="M62 222h54l-4 32H70z" fill="url(#lg-leder)" stroke-width="3"/>
    <path d="M124 222h54l-8 32h-42z" fill="url(#lg-leder)" stroke-width="3"/>
    <path d="M73 248h37M132 248h35" stroke="#e8c48a" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- Arme -->
    <path d="M52 160C34 166 26 180 26 200" fill="none" stroke-width="7"/>
    <path d="M52 160C34 166 26 180 26 200" fill="none" stroke="#2f7fb0" stroke-width="3"/>
    <circle cx="26" cy="204" r="9" fill="#fffdf7" stroke-width="3"/>
    <path d="M188 152C204 146 212 130 214 112" fill="none" stroke-width="7"/>
    <path d="M188 152C204 146 212 130 214 112" fill="none" stroke="#2f7fb0" stroke-width="3"/>
