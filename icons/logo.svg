    <rect x="59" y="53" width="122" height="178" rx="10" fill="none" stroke-opacity=".28" stroke-width="2"/>
    <use href="#lg-heart" transform="translate(54 58) scale(.13)" fill="#e3232d" stroke-width="12"/>
