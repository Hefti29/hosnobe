    <g transform="rotate(-9 120 44)">
      <path d="M146 30c4-12 2-22-2-28M150 31c8-10 10-20 8-28M152 33c10-6 16-14 16-22" fill="none" stroke="#8d8577" stroke-width="3"/>
      <path d="M90 44c2-18 8-30 30-30s28 12 30 30z" fill="#3f6a33" stroke-width="3"/>
      <path d="M104 18c6 4 26 4 32 0" fill="none" stroke="#2b4a22" stroke-width="2.5"/>
      <path d="M92 36h56v8H92z" fill="#b3261e" stroke-width="2"/>
      <ellipse cx="120" cy="45" rx="50" ry="8" fill="#3f6a33" stroke-width="3"/>
      <circle cx="146" cy="39" r="4" fill="#f2c14e" stroke-width="1.5"/>
    </g>
  </g>
</svg>
