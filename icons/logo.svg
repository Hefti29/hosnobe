      <path d="M40 150h160" stroke-width="3"/>
      <path d="M50 158h140" stroke="#e8c48a" stroke-width="2" stroke-dasharray="4 4"/>
      <path d="M120 228v14" stroke-width="2.5"/>
      <!-- Hosentürl mit Knöpfen -->
      <path d="M92 168h56v54H92z" fill="#8a582b" stroke-width="2.5"/>
      <path d="M97 173h46v44H97z" fill="none" stroke="#e8c48a" stroke-width="1.6" stroke-dasharray="3 3"/>
      <path d="M110 186c4 6 16 6 20 0M114 198c3 4 9 4 12 0" fill="none" stroke="#e8c48a" stroke-width="2"/>
    </g>
    <circle cx="98" cy="167" r="4" fill="#d9c7a0" stroke-width="2"/>
    <circle cx="142" cy="167" r="4" fill="#d9c7a0" stroke-width="2"/>
    <rect x="50" y="44" width="140" height="196" rx="16" fill="none" stroke-width="5"/>
