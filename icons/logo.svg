    <g stroke-width="3">
      <path d="M226 84c10 0 12 6 12 12s-2 12-12 12" fill="none" stroke-width="5"/>
      <rect x="196" y="72" width="32" height="42" rx="5" fill="url(#lg-bier)"/>
      <path d="M204 80v28M212 80v28M220 80v28" stroke="#c0820c" stroke-width="2"/>
      <path d="M193 74c0-9 7-13 13-11 3-5 12-5 15 0 6-2 12 3 10 11z" fill="#fffaf0"/>
    </g>
    <circle cx="214" cy="112" r="9" fill="#fffdf7" stroke-width="3"/>
