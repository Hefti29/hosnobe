    <rect x="69" y="42" width="12" height="112" fill="url(#lg-leder)" stroke-width="2.5"/>
    <rect x="159" y="42" width="12" height="112" fill="url(#lg-leder)" stroke-width="2.5"/>
    <path d="M75 48v102M165 48v102" stroke="#e8c48a" stroke-width="1.6" stroke-dasharray="3 3"/>
    <rect x="64" y="122" width="112" height="20" rx="4" fill="url(#lg-leder)" stroke-width="2.5"/>
    <path d="M68 132h104" stroke="#e8c48a" stroke-width="1.6" stroke-dasharray="3 3"/>
    <use href="#lg-heart" transform="translate(109 121) scale(.22)" fill="#e3232d" stroke-width="8"/>
    <!-- Gesicht -->
    <ellipse cx="102" cy="88" rx="10" ry="12" fill="#fff" stroke-width="2.5"/>
    <ellipse cx="138" cy="88" rx="10" ry="12" fill="#fff" stroke-width="2.5"/>
    <circle cx="104" cy="91" r="5.5" fill="#2b2116" stroke="none"/>
    <circle cx="140" cy="91" r="5.5" fill="#2b2116" stroke="none"/>
    <circle cx="106" cy="89" r="1.8" fill="#fff" stroke="none"/>
    <circle cx="142" cy="89" r="1.8" fill="#fff" stroke="none"/>
    <path d="M92 72c5-4 12-4 17-1M131 71c5-3 12-3 17 1" fill="none" stroke-width="3"/>
    <circle cx="90" cy="106" r="6.5" fill="#f28c8c" opacity=".55" stroke="none"/>
    <circle cx="150" cy="106" r="6.5" fill="#f28c8c" opacity=".55" stroke="none"/>
    <path d="M120 103c-8-5-17-4-23 2-3 3-7 3-9 0 2 7 10 9 17 6 6-2 11-4 15-4 4 0 9 2 15 4 7 3 15 1 17-6-2 3-6 3-9 0-6-6-15-7-23-2z" fill="#6b4220" stroke-width="2"/>
    <path d="M110 113c5 6 15 6 20 0" fill="none" stroke-width="3"/>
