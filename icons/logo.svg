<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 310">
  <!-- Hosn Obe: eine Spielkarte in der Lederhose, mit Tirolerhut und Bierkrügerl -->
  <defs>
    <clipPath id="lg-card"><rect x="50" y="44" width="140" height="196" rx="16"/></clipPath>
    <linearGradient id="lg-leder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6634"/>
      <stop offset="1" stop-color="#734520"/>
    </linearGradient>
    <linearGradient id="lg-bier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#e09a12"/>
    </linearGradient>
    <path id="lg-heart" d="M50 93C21 71 5 53 5 33 5 17 17 7 30 7c9 0 16 5 20 13 4-8 11-13 20-13 13 0 25 10 25 26 0 20-16 38-45 60z"/>
  </defs>
  <g stroke="#2b2116" stroke-linejoin="round" stroke-linecap="round">
